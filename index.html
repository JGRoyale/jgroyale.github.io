<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JG Royale</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff}
header{background:#000;padding:18px;text-align:center}
h1{color:#d4af37}
.box{background:#1d1d1d;margin:12px;padding:12px;border-radius:12px}
input,button{width:100%;padding:10px;margin:6px 0;border:none;border-radius:8px}
button{background:#d4af37;color:#000;font-weight:bold}
.item{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
</style>
</head>
<body>

<header>
<h1>JG ROYALE</h1>
<p>Exclusividad en cada detalle</p>
</header>

<div class="box">
<h3>Agregar producto</h3>
<input id="nombre" placeholder="Nombre">
<input id="precio" type="number" placeholder="Precio">
<button onclick="agregar()">Agregar</button>
</div>

<div id="productos"></div>

<div class="box">
<h3>🛒 Carrito</h3>
<div id="carrito"></div>
<h2>Total: $<span id="total">0</span></h2>
<button onclick="comprar()">Comprar por WhatsApp</button>
</div>

<script>
let lista=[],car=[];

function dibujar(){
let p=document.getElementById("productos");
let c=document.getElementById("carrito");
let t=document.getElementById("total");
p.innerHTML=""; c.innerHTML="";
let suma=0;

lista.forEach((x,i)=>{
p.innerHTML+=`<div class="box item">
<div><b>${x.n}</b><br>$${x.p}</div>
<button style="width:90px" onclick="add(${i})">Añadir</button>
</div>`;
});

car.forEach(x=>{
suma+=x.p;
c.innerHTML+=`<div>${x.n} - $${x.p}</div>`;
});

t.textContent=suma;
}

function agregar(){
let n=nombre.value;
let p=Number(precio.value);
if(!n||!p)return;
lista.push({n,p});
nombre.value="";precio.value="";
dibujar();
}

function add(i){
car.push(lista[i]);
dibujar();
}

function comprar(){
let msg="Hola JG Royale%0AQuiero comprar:%0A";
car.forEach(x=>msg+=`• ${x.n} - $${x.p}%0A`);
window.location="https://wa.me/528992174441?text="+msg;
}

dibujar();
</script>

</body>
</html>
