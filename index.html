<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>JG Royale</title><style>body{font-family:Arial;background:#111;color:#fff;margin:0}header{background:#000;padding:18px;text-align:center}h1{color:#d4af37}.box{background:#1d1d1d;margin:12px;padding:12px;border-radius:12px}input,button{width:100%;padding:10px;margin:6px 0;border:0;border-radius:8px}button{background:#d4af37;color:#000;font-weight:bold}.del{background:#c62828!important;color:#fff!important}</style></head><body><header><h1>JG ROYALE</h1><p>Exclusividad</p></header><div class='box'><button onclick='login()'>🔒 Modo Administrador</button></div><div id='admin' class='box' style='display:none'><h3>Agregar producto</h3><input id='n' placeholder='Nombre'><input id='p' type='number' placeholder='Precio'><button onclick='add()'>Agregar</button></div><div id='productos'></div><div class='box'><h3>🛒 Carrito</h3><div id='carrito'></div><h2>Total: $<span id='t'>0</span></h2><button onclick='buy()'>Comprar por WhatsApp</button></div><script>let pro=JSON.parse(localStorage.getItem('productos')||'[]'),car=[],adm=false;function guardar(){localStorage.setItem('productos',JSON.stringify(pro))}function login(){if(prompt('Contraseña')==='JG15diciembre'){adm=true;admin.style.display='block';draw()}else alert('Incorrecta')}function draw(){productos.innerHTML='';carrito.innerHTML='';let s=0;pro.forEach((x,i)=>{productos.innerHTML+=`<div class=box><b>${x.n}</b><br>$${x.p}<button onclick='car.push(pro[${i}]);draw()'>Añadir</button>${adm?`<button class=del onclick='del(${i})'>🗑 Eliminar</button>`:''}</div>`});car.forEach(x=>{s+=x.p;carrito.innerHTML+=`<div>${x.n} - $${x.p}</div>`});t.textContent=s}function add(){pro.push({n:n.value,p:+p.value});guardar();n.value='';p.value='';draw()}function del(i){pro.splice(i,1);guardar();draw()}function buy(){let m='Hola JG Royale%0A';car.forEach(x=>m+=`• ${x.n} $${x.p}%0A`);location='https://wa.me/528992174441?text='+encodeURIComponent(m)}draw();</script></body></html>
