<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>JG Royale</title><style>body{font-family:Arial;background:#111;color:#fff;margin:0}header{background:#000;padding:18px;text-align:center}h1{color:#d4af37}.box{background:#1d1d1d;margin:12px;padding:12px;border-radius:12px}input,button{width:100%;padding:10px;margin:6px 0;border:0;border-radius:8px}button{background:#d4af37;color:#000;font-weight:bold}.del{background:#c62828!important;color:#fff!important}.edit{background:#2563eb!important;color:#fff!important}img{width:100%;border-radius:10px;margin-bottom:8px}</style></head><body><header><h1>JG ROYALE</h1><p>Exclusividad</p></header><div class=box><button onclick=login()>🔒 Modo Administrador</button></div><div id=admin class=box style='display:none'><h3>Agregar producto</h3><input id=n placeholder='Nombre'><input id=p type=number placeholder='Precio'><input id=img type=file accept='image/*'><button onclick=add()>Agregar</button></div><div id=productos></div><div class=box><h3>🛒 Carrito</h3><div id=carrito></div><h2>Total: $<span id=t>0</span></h2><button onclick=buy()>Comprar por WhatsApp</button></div><script>let pro=JSON.parse(localStorage.getItem('productos')||'[]'),car=[],adm=false;const guardar=()=>localStorage.setItem('productos',JSON.stringify(pro));function login(){if(prompt('Contraseña')==='JG15diciembre'){adm=true;admin.style.display='block';draw()}else alert('Incorrecta')}function draw(){productos.innerHTML='';carrito.innerHTML='';let s=0;pro.forEach((x,i)=>{productos.innerHTML+=`<div class=box>${x.img?`<img src='${x.img}'>`:''}<b>${x.n}</b><br>$${x.p}<button onclick='addCart(${i})'>Añadir</button>${adm?`<button class=edit onclick='editImg(${i})'>📷 Cambiar foto</button><button class=del onclick='del(${i})'>🗑 Eliminar</button>`:''}</div>`});car.forEach(x=>{s+=x.p;carrito.innerHTML+=`<div>${x.n} - $${x.p}</div>`});t.textContent=s}function add(){if(!n.value||!p.value)return;const f=img.files[0];if(!f){pro.push({n:n.value,p:+p.value,img:''});guardar();n.value='';p.value='';draw();return}const r=new FileReader();r.onload=e=>{pro.push({n:n.value,p:+p.value,img:e.target.result});guardar();n.value='';p.value='';img.value='';draw()};r.readAsDataURL(f)}function editImg(i){const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=()=>{const r=new FileReader();r.onload=e=>{pro[i].img=e.target.result;guardar();draw()};r.readAsDataURL(input.files[0])};input.click()}function addCart(i){car.push(pro[i]);draw()}function del(i){pro.splice(i,1);guardar();draw()}function buy(){let m='Hola JG Royale%0AQuiero comprar:%0A';car.forEach(x=>m+=`• ${x.n} - $${x.p}%0A`);location='https://wa.me/528992174441?text='+encodeURIComponent(m)}draw();</script></body></html>
